# ── Plugin manager paths ──────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/bin/tmux/plugins"
set -g @tpm_path "~/.local/bin/tmux/plugins/tpm"

# ── General behavior ───────────────────────────────────────
set -g mouse on                        # enable mouse scrolling/selection
set -s set-clipboard external          # use system clipboard for copy/paste
set-window-option -g mode-keys vi      # vi-style keys in copy mode

# ── Reload config with <prefix> r ─────────────────────────
bind r source-file ~/.config/tmux/tmux.conf

# ── Status bar ─────────────────────────────────────────────
set -g status-position top
set -g status-style bg=default,fg=white
set -g status-right '#{prefix_highlight}'

# ── Pane/window indexing starts at 1 ──────────────────────
set -g base-index 1
setw -g pane-base-index 1

# ── Prefix indicator: nerd font icon instead of ^B ────────
set -g @prefix_highlight_prefix_prompt ''
set -g @prefix_highlight_fg 'white'
set -g @prefix_highlight_bg 'default'

# ── Plugins ────────────────────────────────────────────────
set -g @tpm_plugins '                 \
  tmux-plugins/tpm                    \
  tmux-plugins/tmux-sensible          \
  christoomey/vim-tmux-navigator      \
  tmux-plugins/tmux-yank              \
  tmux-plugins/tmux-prefix-highlight  \
  '

# ── Initialize TPM (always keep at the bottom) ────────────
run "$HOME/.local/bin/tmux/plugins/tpm/tpm"
